name: AnDos Ubuntu PC VIRTUAL

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: "Instance Number (1-10)"
        required: true
        default: "1"
        type: string

jobs:
  deploy-linux-rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      - name: System Information
        shell: bash
        run: |
          echo "=========================================="
          echo "       AnDos UBUNTU PC VIRTUAL"
          echo "=========================================="

          echo "Instance: ${{ inputs.instance_number }}"
          echo "Runner: $RUNNER_NAME"

          echo ""
          echo "=== SISTEMA ==="
          uname -a

          echo ""
          echo "=== CPU ==="
          nproc

          echo ""
          echo "=== MEMÓRIA ==="
          free -h

          echo ""
          echo "=== DISCO ==="
          df -h /

      - name: Install XFCE and XRDP
        shell: bash
        run: |
          echo "=========================================="
          echo "       INSTALANDO XFCE + XRDP"
          echo "=========================================="

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xfce4-session \
            xfconf \
            dbus \
            dbus-x11 \
            xrdp \
            xorgxrdp \
            xorg \
            curl \
            wget \
            unzip \
            git \
            htop \
            p7zip-full

          echo "Instalação concluída."

      - name: Create Linux User
        shell: bash
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          echo "=========================================="
          echo "          CRIANDO USUÁRIO"
          echo "=========================================="

          if [ -z "$RDP_PASSWORD" ]; then
            echo "ERRO: RDP_PASSWORD não configurado."
            exit 1
          fi

          if id andospc >/dev/null 2>&1; then
            echo "Usuário andospc já existe."
          else
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              andospc
          fi

          echo "andospc:$RDP_PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo andospc

          sudo mkdir -p /home/andospc/.cache/sessions
          sudo mkdir -p /home/andospc/.config

          sudo chown -R andospc:andospc /home/andospc

          echo "Usuário pronto."

      - name: Configure XFCE for XRDP
        shell: bash
        run: |
          echo "=========================================="
          echo "       CONFIGURANDO XFCE + XRDP"
          echo "=========================================="

          # Configuração global
          sudo tee /etc/profile.d/xfce-xrdp.sh > /dev/null <<'EOF'
          export XDG_CONFIG_DIRS=/etc/xdg:/etc
          export XDG_DATA_DIRS=/usr/share:/usr/local/share
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          EOF

          # Script de inicialização do XRDP
          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          if [ -r /etc/profile ]; then
              . /etc/profile
          fi

          if [ -r "$HOME/.profile" ]; then
              . "$HOME/.profile"
          fi

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_CONFIG_DIRS=/etc/xdg:/etc
          export XDG_DATA_DIRS=/usr/share:/usr/local/share
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce

          exec dbus-run-session -- startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          # Sessão individual do usuário
          sudo tee /home/andospc/.xsession > /dev/null <<'EOF'
          #!/bin/sh

          export XDG_CONFIG_DIRS=/etc/xdg:/etc
          export XDG_DATA_DIRS=/usr/share:/usr/local/share
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          exec dbus-run-session -- startxfce4
          EOF

          sudo chmod +x /home/andospc/.xsession

          sudo chown andospc:andospc /home/andospc/.xsession

          # Limpa sessões antigas
          sudo rm -rf /home/andospc/.cache/sessions

          sudo mkdir -p /home/andospc/.cache/sessions

          sudo chown -R andospc:andospc /home/andospc

          echo "Configuração concluída."

      - name: Configure XRDP Service
        shell: bash
        run: |
          echo "=========================================="
          echo "          INICIANDO XRDP"
          echo "=========================================="

          sudo adduser xrdp ssl-cert || true

          sudo systemctl enable xrdp

          sudo systemctl restart xrdp

          sleep 5

          echo ""
          echo "=== STATUS XRDP ==="

          sudo systemctl --no-pager status xrdp || true

          echo ""
          echo "=== PORTA 3389 ==="

          sudo ss -tlnp | grep ':3389' || true

      - name: Verify XFCE
        shell: bash
        run: |
          echo "=========================================="
          echo "          VERIFICANDO XFCE"
          echo "=========================================="

          echo ""
          echo "startxfce4:"
          command -v startxfce4

          echo ""
          echo "xfce4-session:"
          command -v xfce4-session

          echo ""
          echo "dbus-run-session:"
          command -v dbus-run-session

          echo ""
          echo "xfconf:"
          dpkg-query -W -f='${Status}\n' xfconf

          echo ""
          echo "XDG_CONFIG_DIRS:"
          echo "/etc/xdg:/etc"

          echo ""
          echo "Arquivo XRDP:"
          sudo ls -l /etc/xrdp/startwm.sh

          echo ""
          echo "Arquivo do usuário:"
          sudo ls -l /home/andospc/.xsession

          echo ""
          echo "XFCE OK."

      - name: Install Tailscale
        shell: bash
        run: |
          echo "=========================================="
          echo "          INSTALANDO TAILSCALE"
          echo "=========================================="

          curl -fsSL https://tailscale.com/install.sh | sh

          echo "Tailscale instalado."

      - name: Connect Tailscale
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          echo "=========================================="
          echo "          CONECTANDO TAILSCALE"
          echo "=========================================="

          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "ERRO: TAILSCALE_AUTH_KEY não configurado."
            exit 1
          fi

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname="andos-ubuntu-${{ github.run_id }}"

          sleep 10

          sudo tailscale status

      - name: Get Tailscale IP
        shell: bash
        run: |
          echo "=========================================="
          echo "          IP TAILSCALE"
          echo "=========================================="

          TS_IP=$(sudo tailscale ip -4 | head -n 1)

          if [ -z "$TS_IP" ]; then
            echo "ERRO: IP Tailscale não encontrado."
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "          CONEXÃO RDP"
          echo "=========================================="
          echo ""
          echo "HOST: $TS_IP"
          echo "PORTA: 3389"
          echo "USUÁRIO: andospc"
          echo "SISTEMA: Ubuntu 24.04"
          echo "DESKTOP: XFCE"
          echo ""
          echo "=========================================="

      - name: Install Google Chrome
        shell: bash
        run: |
          echo "=========================================="
          echo "         INSTALANDO GOOGLE CHROME"
          echo "=========================================="

          wget -q \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
            -O /tmp/chrome.deb

          sudo apt-get install -y /tmp/chrome.deb

          rm -f /tmp/chrome.deb

          echo "Chrome instalado."

      - name: Install 7-Zip
        shell: bash
        run: |
          echo "=========================================="
          echo "            INSTALANDO 7-ZIP"
          echo "=========================================="

          sudo apt-get install -y p7zip-full

          echo "7-Zip instalado."

      - name: Final Connection Details
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "       ANDOS UBUNTU PC VIRTUAL"
          echo "=========================================="
          echo ""
          echo "Sistema: Ubuntu 24.04"
          echo "Desktop: XFCE"
          echo "Host: $TAILSCALE_IP"
          echo "Porta: 3389"
          echo "Usuário: andospc"
          echo ""
          echo "No aplicativo de RDP:"
          echo ""
          echo "PC: $TAILSCALE_IP"
          echo "Usuário: andospc"
          echo "Senha: a definida em RDP_PASSWORD"
          echo ""
          echo "=========================================="

      - name: Keep Session Alive
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "       UBUNTU PC VIRTUAL ATIVO"
          echo "=========================================="
          echo ""
          echo "O job do GitHub tem limite de 6 horas."
          echo ""

          counter=0

          while true
          do
            counter=$((counter + 1))

            echo "Heartbeat #$counter - $(date)"

            if sudo tailscale status >/dev/null 2>&1
            then
              echo "Tailscale: ACTIVE"
            else
              echo "Tailscale: ERROR"
            fi

            if systemctl is-active --quiet xrdp
            then
              echo "XRDP: ACTIVE"
            else
              echo "XRDP: ERROR"
              sudo systemctl restart xrdp || true
            fi

            echo ""

            sleep 60
          done
